aws_region: "us-east-1"
aws_access_key_id: "{{ lookup('env', 'AWS_ACCESS_KEY_ID') }}"
aws_secret_access_key: "{{ lookup('env', 'AWS_SECRET_ACCESS_KEY') }}"
ecs_cluster_name: "{{ lookup('env', 'ECS_CLUSTER_NAME') }}"
base_domain: "{{ lookup('env', 'BASE_DOMAIN') }}"


alb_name: "explore-alb"
alb_arn: "arn:aws:elasticloadbalancing:us-east-1:535002867043:loadbalancer/app/explore-alb/5b4d068ba78c0af0"
vpc_id: "vpc-08df88066b13c5310"
# Subnets for ECS tasks
vpc_subnets:
  - "subnet-05694082e443bb9ee"
  - "subnet-0048287c41a8f724d"

# Docker images in ECR
laravel_image: "535002867043.dkr.ecr.us-east-1.amazonaws.com/my-laravel:latest"
mssql_image: "535002867043.dkr.ecr.us-east-1.amazonaws.com/my-mssql:latest"

sa_password: "{{ lookup('env', 'MSSQL_SA_PASSWORD') }}"
app_key: "{{ lookup('env', 'APP_KEY') }}"
security_group_id: "sg-0229ce0be6b4a55ba"
# Pre-existing ALB

acm_certificate_arn: "arn:aws:acm:us-east-1:535002867043:certificate/a98d44c4-e1a1-4006-aa69-dc83ae473074"

# ECS IAM roles
ecs_task_execution_role_arn: "arn:aws:iam::535002867043:role/ecsTaskExecutionRole"
ecs_task_role_arn: "arn:aws:iam::535002867043:role/ecsTaskRole"  # Omit if not needed


# Ephemeral usage
environment_tag: "ephemeral"
default_expire_days: 5
