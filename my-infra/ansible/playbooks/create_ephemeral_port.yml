---
- name: Create ephemeral environment on random ALB port + domain
  hosts: localhost
  gather_facts: false
  environment:
    AWS_DEFAULT_REGION: "{{ aws_region }}"
    AWS_REGION: "{{ aws_region }}"
  collections:
    - amazon.aws
    - community.general

  vars_files:
    - "{{ playbook_dir }}/../group_vars/all.yml"

  vars:
    port_range_start: 9000
    port_range_end: 9999
    expire_on: "{{ '%Y-%m-%d' | strftime((lookup('pipe', 'date -u +%s') | int) + ((default_expire_days | int) * 86400), utc=true) }}"

  pre_tasks:
    - name: Set unique ID for the environment
      set_fact:
        unique_id: "{{ lookup('ansible.builtin.password', '/dev/null', length=14, chars=['digits']) }}"
    - name: Publish environment ID for workflow cleanup
      ansible.builtin.lineinfile:
        path: "{{ lookup('env', 'GITHUB_OUTPUT') }}"
        line: "environment_id={{ unique_id }}"
        insertafter: EOF
      when: lookup('env', 'GITHUB_OUTPUT') | length > 0
    - name: Debug AWS configuration
      debug:
        msg:
          - "AWS Region: {{ lookup('env', 'AWS_REGION') | default('NOT SET') }}"
          - "AWS Default Region: {{ lookup('env', 'AWS_DEFAULT_REGION') | default('NOT SET') }}"
          - "ALB Name: {{ alb_name | default('NOT SET') }}"
          - "ALB ARN: {{ alb_arn | default('NOT SET') }}"
    - name: Validate required variables
      assert:
        that:
          - vpc_id is defined
          - vpc_subnets is defined
          - security_group_id is defined
          - ecs_cluster_name is defined
          - ecs_cluster_name | length > 0
          - base_domain is defined
          - base_domain | length > 0
          - sa_password is defined and sa_password | length > 0
          - app_key is defined and app_key | length > 0
          - laravel_image is defined
          - mssql_image is defined
          - ecs_task_execution_role_arn is defined
          - alb_arn is defined
          - acm_certificate_arn is defined
        fail_msg: "Missing required variables. Please ensure all environment variables are set."
    - name: Validate ECS task execution role exists
      shell: "aws iam get-role --role-name {{ ecs_task_execution_role_arn.split('/')[-1] }}"
      register: exec_role_info
      changed_when: false
      failed_when: exec_role_info.rc != 0
      environment:
        AWS_DEFAULT_REGION: "{{ aws_region }}"
    - name: Validate ECS task role exists (if provided)
      when: ecs_task_role_arn is defined and ecs_task_role_arn | length > 0
      shell: "aws iam get-role --role-name {{ ecs_task_role_arn.split('/')[-1] }}"
      register: task_role_info
      changed_when: false
      failed_when: task_role_info.rc != 0
      environment:
        AWS_DEFAULT_REGION: "{{ aws_region }}"

  tasks:
    ##################################################################
    # 1) Select and validate random port
    ##################################################################
    - name: Select a random available ephemeral port
      block:
        - name: Read existing ALB listeners
          amazon.aws.elb_application_lb_info:
            region: "{{ aws_region }}"
            load_balancer_arns: ["{{ alb_arn }}"]
            include_listeners: true
            include_listener_rules: false
          register: alb_info
          retries: 3
          delay: 5
          until: alb_info is success

        - name: Validate the configured ALB exists
          assert:
            that:
              - alb_info.load_balancers | length == 1
            fail_msg: "Expected exactly one configured ALB"

        - name: Calculate available ports
          set_fact:
            available_ports: "{{ range(port_range_start, port_range_end + 1) | difference(alb_info.load_balancers[0].listeners | map(attribute='port') | list) | list }}"

        - name: Require an available port
          assert:
            that:
              - available_ports | length > 0
            fail_msg: "No free ports remain in the configured ephemeral range"

        - name: Select an available port
          set_fact:
            candidate_port: "{{ available_ports | random }}"

    - name: Display selected port
      debug:
        msg: "Selected port {{ candidate_port }}"

    - name: Publish base URL for workflow tests
      ansible.builtin.lineinfile:
        path: "{{ lookup('env', 'GITHUB_OUTPUT') }}"
        line: "base_url=https://{{ base_domain }}:{{ candidate_port }}"
        insertafter: EOF
      when: lookup('env', 'GITHUB_OUTPUT') | length > 0

    ##################################################################
    # 2) Create target group
    ##################################################################
    - name: Create target group
      community.aws.elb_target_group:
        name: "tg-port{{ candidate_port }}-{{ unique_id }}"
        protocol: HTTP
        port: 80
        vpc_id: "{{ vpc_id }}"
        target_type: ip
        health_check_path: "/"
        health_check_protocol: HTTP
        health_check_interval: 30
        health_check_timeout: 5
        healthy_threshold_count: 2
        unhealthy_threshold_count: 3
        successful_response_codes: "200"
        state: present
        tags:
          Name: "ephemeral-{{ unique_id }}"
          Environment: "{{ environment_tag }}"
          Cluster: "{{ ecs_cluster_name }}"
          ExpireOn: "{{ expire_on }}"
          CreatedBy: "ansible"
      register: target_group

    ##################################################################
    # 3) Create CloudWatch log group for ECS tasks
    ##################################################################
    - name: Create CloudWatch log group for ECS tasks
      amazon.aws.cloudwatchlogs_log_group:
        log_group_name: "/ecs/ephemeral/{{ unique_id }}"
        state: present
        tags:
          Environment: "{{ environment_tag }}"
          Cluster: "{{ ecs_cluster_name }}"
          ExpireOn: "{{ expire_on }}"
          CreatedBy: "ansible"

    ##################################################################
    # 4) Create ECS Task Definition
    ##################################################################
    - name: Create task definition
      no_log: true
      community.aws.ecs_taskdefinition:
        family: "ephemeral-{{ unique_id }}"
        containers:
          - name: laravel
            image: "{{ laravel_image }}"
            essential: true
            portMappings:
              - containerPort: 80
                hostPort: 80
                protocol: tcp
            cpu: 2048
            memory: 3072
            environment:
              - name: APP_KEY
                value: "{{ app_key }}"
              - name: DB_CONNECTION
                value: sqlsrv
              - name: DB_HOST
                value: localhost
              - name: DB_PORT
                value: "1433"
              - name: DB_DATABASE
                value: cypress_test
              - name: DB_USERNAME
                value: sa
              - name: DB_PASSWORD
                value: "{{ sa_password }}"
            logConfiguration:
              logDriver: awslogs
              options:
                awslogs-group: "/ecs/ephemeral/{{ unique_id }}"
                awslogs-region: "{{ aws_region }}"
                awslogs-stream-prefix: "laravel"
                awslogs-create-group: "true"
          - name: mssql
            image: "{{ mssql_image }}"
            essential: true
            portMappings:
              - containerPort: 1433
                hostPort: 1433
                protocol: tcp
            cpu: 2048
            memory: 5120
            environment:
              - name: ACCEPT_EULA
                value: "Y"
              - name: SA_PASSWORD
                value: "{{ sa_password }}"
            logConfiguration:
              logDriver: awslogs
              options:
                awslogs-group: "/ecs/ephemeral/{{ unique_id }}"
                awslogs-region: "{{ aws_region }}"
                awslogs-stream-prefix: "mssql"
                awslogs-create-group: "true"
        launch_type: FARGATE
        cpu: "4096"
        memory: "8192"
        network_mode: awsvpc
        execution_role_arn: "{{ ecs_task_execution_role_arn }}"
        task_role_arn: "{{ ecs_task_role_arn | default(omit) }}"
        state: present
      register: task_definition

    - name: Tag ECS task definition
      command:
        argv:
          - aws
          - ecs
          - tag-resource
          - --resource-arn
          - "{{ task_definition.taskdefinition.taskDefinitionArn }}"
          - --tags
          - "key=Name,value=ephemeral-{{ unique_id }}"
          - "key=Environment,value={{ environment_tag }}"
          - "key=Cluster,value={{ ecs_cluster_name }}"
          - "key=ExpireOn,value={{ expire_on }}"
          - "key=CreatedBy,value=ansible"

    ##################################################################
    # 5) Create ALB Listener via AWS CLI
    ##################################################################
    - name: Create ALB listener via AWS CLI
      command: >
        aws elbv2 create-listener
        --load-balancer-arn {{ alb_arn }}
        --port {{ candidate_port }}
        --protocol HTTPS
        --ssl-policy ELBSecurityPolicy-TLS-1-2-2017-01
        --certificates CertificateArn={{ acm_certificate_arn }}
        --default-actions Type=forward,TargetGroupArn={{ target_group.target_group_arn }}
      register: cli_listener
      changed_when: "'ListenerArn' in cli_listener.stdout"

    - name: Debug CLI listener output
      debug:
        var: cli_listener.stdout

    ##################################################################
    # 6) Create ECS Service
    ##################################################################
    - name: Create ECS service
      community.aws.ecs_service:
        name: "ephemeral-{{ unique_id }}"
        cluster: "{{ ecs_cluster_name }}"
        task_definition: "{{ task_definition.taskdefinition.taskDefinitionArn }}"
        desired_count: 1
        network_configuration:
          subnets: "{{ vpc_subnets }}"
          security_groups: ["{{ security_group_id }}"]
          assign_public_ip: yes
        load_balancers:
          - targetGroupArn: "{{ target_group.target_group_arn }}"
            containerName: laravel
            containerPort: 80
        health_check_grace_period_seconds: 120
        deployment_configuration:
          maximum_percent: 200
          minimum_healthy_percent: 100
        capacity_provider_strategy:
          - capacity_provider: FARGATE
            weight: 1
            base: 1
        tags:
          Name: "ephemeral-{{ unique_id }}"
          Environment: "{{ environment_tag }}"
          Cluster: "{{ ecs_cluster_name }}"
          ExpireOn: "{{ expire_on }}"
          CreatedBy: "ansible"
        state: present
      register: ecs_service

    ##################################################################
    # 8) Wait for ECS service to become active
    ##################################################################
    - name: Wait for ECS service to become active
      command:
        argv:
          - aws
          - ecs
          - wait
          - services-stable
          - --cluster
          - "{{ ecs_cluster_name }}"
          - --services
          - "ephemeral-{{ unique_id }}"
      changed_when: false

    ##################################################################
    # 9) Create target tracking scaling policy for ECS Service
    ##################################################################
    - name: Create target tracking scaling policy for ECS Service
      community.aws.application_autoscaling_policy:
        state: present
        policy_name: "cpu-utilization-policy"
        service_namespace: ecs
        resource_id: "service/{{ ecs_cluster_name }}/ephemeral-{{ unique_id }}"
        scalable_dimension: ecs:service:DesiredCount
        policy_type: TargetTrackingScaling
        minimum_tasks: 1
        maximum_tasks: 6
        target_tracking_scaling_policy_configuration:
          TargetValue: 50
          PredefinedMetricSpecification:
            PredefinedMetricType: ECSServiceAverageCPUUtilization
          ScaleOutCooldown: 60
          ScaleInCooldown: 60

    ##################################################################
    # 10) Display Results and Save Environment Info
    ##################################################################
    - name: Save environment details
      copy:
        content: |
          Environment ID: {{ unique_id }}
          Access URL: https://{{ base_domain }}:{{ candidate_port }}
          Expires on: {{ expire_on }}
          Task Definition: {{ task_definition.taskdefinition.taskDefinitionArn }}
          Service: {{ ecs_service.service.serviceName }}
          Target Group: {{ target_group.target_group_arn }}
          Created: {{ now(utc=true, fmt='%Y-%m-%d_%H:%M:%SZ') }}
        dest: "./environment-{{ unique_id }}.txt"
      delegate_to: localhost

    - name: Show environment details
      debug:
        msg:
          - "Ephemeral environment created successfully!"
          - "Environment ID: {{ unique_id }}"
          - "Access URL: https://{{ base_domain }}:{{ candidate_port }}"
          - "Expires on: {{ expire_on }}"
          - "Task Definition: {{ task_definition.taskdefinition.taskDefinitionArn }}"
          - "Service: {{ ecs_service.service.serviceName }}"
          - "Details saved to: environment-{{ unique_id }}.txt"
